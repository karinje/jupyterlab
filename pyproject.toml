[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyter-agent-bridge"
version = "0.0.1"
# description etc.
dependencies = [
    "jupyter_server>=2.0",
    "aiohttp>=3.8",
    "y_py>=0.6",
    "pycrdt>=0.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.20",
    "rich>=12.0",
    "aiohttp>=3.7.0",
]
dev = [
    "black",
    "isort",
    "flake8",
]

[project.entry-points."jupyter_server.extensions"]
jupyter_agent_bridge = "jupyter_agent_bridge"

[tool.setuptools.packages.find]
where = ["."]
include = ["jupyter_agent_bridge*"]
